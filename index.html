                      <p>${escapeHtml(item.teacher || "Keine Lehrperson")} · Raum ${escapeHtml(item.room || "—")}</p>
                      <p style="margin-top:4px;font-size:0.82rem;">${state.timetable.filter(l => l.fachId === item.id).map(l => `${l.weekday} ${l.startTime}`).join(", ") || "Kein Stundenplan"}</p>
                    </div>
                  </div>
                  <div class="subject-row-actions">
                    <button class="tiny-button" type="button" data-action="open-subject-manager" data-subject-id="${item.id}" aria-label="Fach bearbeiten"><span class="material-symbols-outlined" style="font-size: 1.1em;">edit</span></button>
                    <button class="tiny-button danger" type="button" data-action="delete-subject" data-subject-id="${item.id}" aria-label="Fach löschen"><span class="material-symbols-outlined" style="font-size: 1.1em;">delete</span></button>
                  </div>
                </div>
              `).join("") : `
                <div class="empty-state">
                  <span class="empty-icon">🎓</span>
                  <h3>Noch keine Fächer</h3>
                  <p>Lege rechts dein erstes Fach an.</p>
                </div>
              `}
            </div>

            <div style="display:grid;gap:18px;">
              <form class="form-grid" data-form="subject" data-draft-form="subject" data-draft-id="${escapeHtml(subject?.id || "new")}">
                <input type="hidden" name="id" value="${escapeHtml(values.id || "")}">
                <div class="field">
                  <label for="subject-name">Fachname</label>
                  <input id="subject-name" type="text" name="name" required value="${escapeHtml(values.name)}" placeholder="Zum Beispiel Mathematik">
                </div>
                <div class="form-grid two">
                  <div class="field">
                    <label for="subject-color">Farbe</label>
                    <input id="subject-color" type="color" name="color" required value="${escapeHtml(values.color)}">
                  </div>
                  <div class="field">
                    <label for="subject-room">Raum</label>
                    <input id="subject-room" type="text" name="room" value="${escapeHtml(values.room)}" placeholder="Zum Beispiel B204">
                  </div>
                </div>
                <div class="field">
                  <label for="subject-teacher">Lehrperson</label>
                  <input id="subject-teacher" type="text" name="teacher" value="${escapeHtml(values.teacher)}" placeholder="Zum Beispiel Frau Keller">
                </div>
                <div class="button-row">
                  <button class="button" type="submit">${subject ? "Fach speichern" : "Fach anlegen"}</button>
                  <button class="ghost-button" type="button" data-action="open-subject-manager">Neues Fach</button>
                </div>
              </form>

              ${subject ? `
                <div style="border-top:1px solid var(--line);padding-top:18px;">
                  <p class="eyebrow" style="margin-bottom:12px;">Stunden im Plan</p>
                  ${subjectLessons.length ? `
                    <div class="mini-list" style="margin-bottom:14px;">
                      ${subjectLessons.map(l => `
                        <div class="mini-item" style="padding:10px 14px;">
                          <div class="mini-item-content">
                            <strong>${l.weekday}</strong> &nbsp; ${l.startTime} – ${l.endTime} &nbsp; Raum ${escapeHtml(l.room || values.room || "—")}
                          </div>
                          <button class="tiny-button danger" type="button" data-action="delete-lesson" data-lesson-id="${l.id}" aria-label="Lektion löschen"><span class="material-symbols-outlined" style="font-size:1.1em;">delete</span></button>
                        </div>
                      `).join("")}
                    </div>
                  ` : `<p style="color:var(--muted);font-size:0.9rem;margin-bottom:14px;">Noch keine Lektionen eingetragen.</p>`}
                  
                  <form class="form-grid" data-form="lesson-quick" data-subject-id="${escapeHtml(subject.id)}">
                    <p style="font-weight:600;margin:0 0 8px;">Neue Lektion hinzufügen</p>
                    <div class="form-grid two">
                      <div class="field">
                        <label>Wochentag</label>
                        <select name="weekday" required>
                          ${WEEKDAYS.map((day) => `<option value="${day}" ${lessonDraft.weekday === day ? "selected" : ""}>${day}</option>`).join("")}
                        </select>
                      </div>
                      <div class="field">
                        <label>Startzeit</label>
                        <input type="time" name="startTime" required value="${escapeHtml(lessonDraft.startTime)}">
                      </div>
                    </div>
                    <div class="field">
                      <label>Raum (optional)</label>
                      <input type="text" name="room" value="${escapeHtml(lessonDraft.room)}" placeholder="${escapeHtml(values.room || "Stammraum verwenden")}">
                    </div>
                    <div class="button-row">
                      <button class="button" type="submit"><span class="material-symbols-outlined">add</span> Lektion (45 Min.) anlegen</button>
                      <button class="ghost-button" type="button" data-action="add-break-quick" data-break="5" data-subject-id="${escapeHtml(subject.id)}">+ 5 Min. Pause</button>
                      <button class="ghost-button" type="button" data-action="add-break-quick" data-break="20" data-subject-id="${escapeHtml(subject.id)}">+ 20 Min. Pause</button>
                    </div>
                  </form>
                </div>
              ` : ""}
            </div>
          </div>
        </div>
      `;
    }

    function renderResetModal() {
      return `
        <div class="modal-card">
          <div class="modal-header">
            <div>
              <p class="eyebrow" style="color: var(--red);">Gefahr</p>
              <h3 class="card-title">Alle Daten dauerhaft löschen?</h3>
              <p>Bist du sicher? Alle deine Fächer, Hausaufgaben, Prüfungen und Lektionen werden unwiderruflich gelöscht. Es bleiben keine Daten zurück.</p>
            </div>
            <button class="tiny-button" type="button" data-action="close-modal"><span class="material-symbols-outlined" style="font-size: 1.1em;">close</span></button>
          </div>
          <div class="button-row">
            <button class="danger-button" type="button" data-action="confirm-reset">Ja, unwiderruflich löschen</button>
            <button class="ghost-button" type="button" data-action="close-modal">Abbrechen</button>
          </div>
        </div>
      `;
    }

    function renderConfirmDeleteModal(payload) {
      return `
        <div class="modal-card">
          <div class="modal-header">
            <div>
              <p class="eyebrow">Achtung</p>
              <h3 class="card-title">${escapeHtml(payload.title)}</h3>
              <p>${escapeHtml(payload.text)}</p>
            </div>
            <button class="tiny-button" type="button" data-action="close-modal"><span class="material-symbols-outlined" style="font-size: 1.1em;">close</span></button>
          </div>
          <div class="button-row">
            <button class="danger-button" type="button" data-action="${escapeHtml(payload.confirmAction)}" data-target-id="${escapeHtml(payload.payloadId)}">Löschen</button>
            <button class="ghost-button" type="button" data-action="close-modal">Abbrechen</button>
          </div>
        </div>
      `;
    }

    function renderModal() {
      const layer = document.getElementById("modalLayer");
      const root = document.getElementById("modalRoot");
      if (!ui.modal) {
        layer.classList.add("hidden");
        root.innerHTML = "";
        return;
      }

      let content = "";
      if (ui.modal.type === "homework") {
        content = renderHomeworkModal(ui.modal.homeworkId);
      } else if (ui.modal.type === "exam") {
        content = renderExamModal(ui.modal.examId);
      } else if (ui.modal.type === "lesson") {
        content = renderLessonModal(ui.modal.lessonId, ui.modal.preset || {});
      } else if (ui.modal.type === "subjects") {
        content = renderSubjectsModal(ui.modal.subjectId);
      } else if (ui.modal.type === "reset") {
        content = renderResetModal();
      } else if (ui.modal.type === "confirm-delete") {
        content = renderConfirmDeleteModal(ui.modal);
      }

      root.innerHTML = content;
      layer.classList.remove("hidden");
    }

    function renderApp() {
      applyTheme();
      renderNav();
      renderTopbar();
      renderView();
      if (appStatus.mode === "ready") {
        // Don't re-render the modal if a form element inside it has focus (prevents flicker/focus loss)
        const modalRoot = document.getElementById("modalRoot");
        const activeEl = document.activeElement;
        const isTypingInModal = modalRoot && activeEl && modalRoot.contains(activeEl) &&
          (activeEl.tagName === "INPUT" || activeEl.tagName === "TEXTAREA" || activeEl.tagName === "SELECT");
        if (!isTypingInModal) {
          renderModal();
        }
      } else {
        ui.modal = null;
        renderModal();
      }
    }

    function closeModal() {
      ui.modal = null;
      renderModal();
    }

    function openModal(type, payload = {}) {
      ui.modal = { type, ...payload };
      renderModal();
    }

    function setSection(section) {
      ui.section = section;
      renderApp();
      if (section === "admin" && appStatus.isAdmin) {
        if (!appStatus.adminUsers.length) {
          refreshAdminAccess();
        } else if (ui.adminSelectedUid) {
          loadAdminUserDetail(ui.adminSelectedUid);
        }
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function toggleHomeworkStatus(homeworkId, forceDone = null) {
      const item = state.homework.find((entry) => entry.id === homeworkId);
      if (!item) {
        return;
      }
      const nextStatus = forceDone === null ? (item.status === "offen" ? "erledigt" : "offen") : (forceDone ? "erledigt" : "offen");
      item.status = nextStatus;
      saveState();
      renderApp();
    }

    function deleteHomework(homeworkId) {
      state.homework = state.homework.filter((entry) => entry.id !== homeworkId);
      ui.expandedHomework.delete(homeworkId);
      saveState();
      renderApp();
    }

    function deleteExam(examId) {
      state.exams = state.exams.filter((entry) => entry.id !== examId);
      ui.expandedExams.delete(examId);
      saveState();
      renderApp();
    }

    function deleteLesson(lessonId) {
      state.timetable = state.timetable.filter((entry) => entry.id !== lessonId);
      saveState();
      closeModal();
      renderApp();
    }

    function deleteSubject(subjectId) {
      const subject = getSubject(subjectId);
      if (!subject) return;

      state.subjects = state.subjects.filter((entry) => entry.id !== subjectId);
      state.homework = state.homework.filter((entry) => entry.fachId !== subjectId);
      state.exams = state.exams.filter((entry) => entry.fachId !== subjectId);
      state.timetable = state.timetable.filter((entry) => entry.fachId !== subjectId);
      saveState();
      openModal("subjects");
      renderApp();
    }

    function saveHomeworkFromForm(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      const payload = {
        fachId: data.fachId,
        title: data.title.trim(),
        description: data.description.trim(),
        dueDate: data.dueDate,
        note: data.note.trim()
      };

      if (data.id) {
        const existing = state.homework.find((item) => item.id === data.id);
        Object.assign(existing, payload);
        clearDraft("homework", data.id);
      } else {
        state.homework.unshift({
          id: generateId("hw"),
          ...payload,
          status: "offen",
          createdAt: new Date().toISOString()
        });
        clearDraft("homework", "new");
      }

      saveState();
      closeModal();
      renderApp();
    }

    function saveExamFromForm(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      const topics = data.topics
        .split(",")
        .map((topic) => topic.trim())
        .filter(Boolean);

      if (data.id) {
        const existing = state.exams.find((item) => item.id === data.id);
        existing.fachId = data.fachId;
        existing.title = data.title.trim();
        existing.date = data.date;
        existing.topics = topics;
        existing.note = data.note.trim();

        const existingTexts = new Set(existing.learningChecklist.map((entry) => entry.text));
        topics.forEach((topic) => {
          const defaultStep = `${topic} wiederholen`;
          if (!existingTexts.has(defaultStep)) {
            existing.learningChecklist.push({
              id: generateId("check"),
              text: defaultStep,
              done: false
            });
          }
        });
        clearDraft("exam", data.id);
      } else {
        state.exams.push({
          id: generateId("exam"),
          fachId: data.fachId,
          title: data.title.trim(),
          date: data.date,
          topics,
          learningChecklist: topics.map((topic) => ({
            id: generateId("check"),
            text: `${topic} wiederholen`,
            done: false
          })),
          note: data.note.trim(),
          createdAt: new Date().toISOString()
        });
        clearDraft("exam", "new");
      }

      saveState();
      closeModal();
      renderApp();
    }

    function hasLessonOverlap(candidate) {
      const candidateStart = candidate.startTime;
      const candidateEnd = candidate.endTime;
      return state.timetable.some((lesson) => {
        if (lesson.weekday !== candidate.weekday || lesson.id === candidate.id) {
          return false;
        }
        return candidateStart < lesson.endTime && candidateEnd > lesson.startTime;
      });
    }

    function saveLessonFromForm(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      if (data.startTime >= data.endTime) {
        showToast("Endzeit muss nach der Startzeit liegen");
        return;
      }

      const existing = data.id ? state.timetable.find((item) => item.id === data.id) : null;
      const subject = getSubject(data.fachId);
      const candidate = {
        id: data.id,
        weekday: data.weekday,
        fachId: data.fachId,
        startTime: data.startTime,
        endTime: data.endTime,
        room: existing?.room || subject?.room || ""
      };

      if (hasLessonOverlap(candidate)) {
        showToast("Zeitblock überschneidet sich bereits");
        return;
      }

      if (data.id) {
        Object.assign(existing, candidate);
        clearDraft("lesson", data.id);
      } else {
        state.timetable.push({
          ...candidate,
          id: generateId("lesson")
        });
        clearDraft("lesson", "new");
      }

      saveState();
      closeModal();
      renderApp();
    }

    function saveSubjectFromForm(form) {
      const data = Object.fromEntries(new FormData(form).entries());
      const payload = {
        name: data.name.trim(),
        color: data.color,
        teacher: data.teacher.trim(),
        room: data.room.trim()
      };

      if (data.id) {
        const existing = state.subjects.find((subject) => subject.id === data.id);
        Object.assign(existing, payload);
        clearDraft("subject", data.id);
      } else {
        state.subjects.push({
          id: generateId("subject"),
          ...payload
        });
        clearDraft("subject", "new");
      }

      saveState();
      openModal("subjects");
      renderApp();
    }

    function shiftCalendar(direction) {
      const step = Number(direction);
      if (ui.calendarView === "month") {
        ui.calendarDate = addMonths(ui.calendarDate, step);
      } else if (ui.calendarView === "week") {
        ui.calendarDate = addDays(ui.calendarDate, step * 7);
      } else {
        ui.calendarDate = addDays(ui.calendarDate, step);
      }
      if (ui.calendarView !== "day") {
        ui.selectedDay = null;
      }
      renderApp();
    }

    async function handleAction(button) {
      const action = button.dataset.action;
      if (action === "start-demo") {
        startDemo();
        return;
      }

      if (action === "reset-demo") {
        if (window.confirm("Alle deine Änderungen in der Demo verwerfen?")) {
          startDemo({ fresh: true });
        }
        return;
      }

      if (action === "set-auth-mode") {
        ui.authMode = button.dataset.authMode || "signin";
        renderApp();
        return;
      }

      if (action === "sign-in-google") {
        signInWithGoogle();
        return;
      }

      if (action === "admin-delete-user") {
        if (!appStatus.isAdmin) return;
        const uid = button.dataset.uid;
        const userName = appStatus.adminDetail?.displayName || appStatus.adminDetail?.email || uid;
        openModal("confirm-delete", {
          title: `„${userName}" endgültig löschen?`,
          text: "Der Benutzer wird aus Firebase Authentication, Firestore und den Genehmigungen entfernt. Diese Aktion kann nicht rückgängig gemacht werden.",
          confirmAction: "confirm-delete-user",
          payloadId: uid
        });
        return;
      }

      if (action === "confirm-delete-user") {
        const uid = button.dataset.targetId;
        if (!uid || !appStatus.isAdmin) return;
        closeModal();
        try {
          const token = await getFreshIdToken();
          const response = await fetch("/api/admin/approve", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ uid, deleteUser: true })
          });
          if (!response.ok) {
            throw new Error("API-Fehler");
          }
          showToast("Benutzer gelöscht");
          ui.adminSelectedUid = "";
          appStatus.adminDetail = null;
          await refreshAdminAccess();
          renderApp();
        } catch (error) {
          console.error(error);
          showToast("Löschen fehlgeschlagen");
        }
        return;
      }

      if (action === "sign-out") {
        logOut();
        return;
      }

      if (action === "log-out") {
        logOut();
        return;
      }

      if (action === "refresh-admin") {
        refreshAdminAccess().then(() => {
          if (ui.adminSelectedUid) {
            loadAdminUserDetail(ui.adminSelectedUid);
          }
        });
        return;
      }

      if (action === "set-admin-filter") {
        ui.adminFilterStatus = button.dataset.filter || "pending";
        renderApp();
        return;
      }

      if (action === "toggle-admin-checkbox") {
        const uid = button.dataset.uid;
        if (!uid) return;
        if (ui.selectedAdminUids.has(uid)) {
          ui.selectedAdminUids.delete(uid);
        } else {
          ui.selectedAdminUids.add(uid);
        }
        renderApp();
        return;
      }

      if (action === "toggle-admin-select-all") {
        const users = visibleAdminUsers();
        const allSelected = users.length > 0 && users.every((user) => ui.selectedAdminUids.has(user.uid));
        if (allSelected) {
          users.forEach((user) => ui.selectedAdminUids.delete(user.uid));
        } else {
          users.forEach((user) => ui.selectedAdminUids.add(user.uid));
        }
        renderApp();
        return;
      }

      if (action === "admin-bulk-approve") {
        if (!appStatus.isAdmin || !ui.selectedAdminUids.size) return;
        const selectedUids = [...ui.selectedAdminUids];
        button.disabled = true;
        try {
          const token = await getFreshIdToken();
          for (const uid of selectedUids) {
            const response = await fetch("/api/admin/approve", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({ uid, approved: true })
            });
            if (!response.ok) {
              throw new Error("API-Fehler");
            }
          }
          ui.selectedAdminUids.clear();
          showToast(`${selectedUids.length} Benutzer freigegeben`);
          await refreshAdminAccess();
          if (ui.adminSelectedUid) {
            await loadAdminUserDetail(ui.adminSelectedUid);
          } else {
            renderApp();
          }
        } catch (error) {
          console.error(error);
          showToast("Sammel-Freigabe fehlgeschlagen");
          button.disabled = false;
        }
        return;
      }

      if (action === "admin-toggle-approval") {
        if (!appStatus.isAdmin) return;
        const uid = button.dataset.uid;
        const approved = button.dataset.approved === "true";
        if (!uid) return;
        button.disabled = true;
        try {
          const token = await getFreshIdToken();
          const response = await fetch("/api/admin/approve", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ uid, approved })
          });
          if (!response.ok) {
            throw new Error("API-Fehler");
          }
          if (approved) {
            ui.selectedAdminUids.delete(uid);
          }
          showToast(approved ? "Benutzer genehmigt" : "Genehmigung entfernt");
          await refreshAdminAccess();
          if (ui.adminSelectedUid === uid) {
            await loadAdminUserDetail(uid);
          } else {
            renderApp();
          }
        } catch (error) {
          console.error(error);
          button.disabled = false;
          showToast("Aktualisierung fehlgeschlagen");
        }
        return;
      }

      if (action === "admin-seed-user") {
        if (!appStatus.isAdmin) return;
        const uid = button.dataset.uid;
        if (!uid) return;
        button.disabled = true;
        try {
          const token = await getFreshIdToken();
          const response = await fetch("/api/admin/seed", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ uid })
          });
          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Seed fehlgeschlagen");
          }
          showToast("Beispieldaten wurden geladen");
          await loadAdminUserDetail(uid);
        } catch (error) {
          console.error(error);
          showToast("Beispieldaten konnten nicht geladen werden");
          button.disabled = false;
        }
        return;
      }

      if (action === "admin-reset-password") {
        if (!appStatus.isAdmin) return;
        const uid = button.dataset.uid;
        const passwordInput = document.getElementById("admin-new-password");
        const password = passwordInput?.value?.trim();
        if (!uid || !password) {
          showToast("Bitte ein Passwort eingeben");
          return;
        }
        button.disabled = true;
        try {
          const token = await getFreshIdToken();
          const response = await fetch("/api/admin/reset-password", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ uid, password })
          });
          if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || "Passwort-Reset fehlgeschlagen");
          }
          passwordInput.value = "";
          showToast("Passwort wurde gesetzt");
        } catch (error) {
          console.error(error);
          showToast(error.message || "Passwort konnte nicht gesetzt werden");
        } finally {
          button.disabled = false;
        }
        return;
      }

      if (action === "select-admin-user") {
        ui.adminSelectedUid = button.dataset.adminUid || "";
        loadAdminUserDetail(ui.adminSelectedUid);
        return;
      }

      if (action === "toggle-sidebar") {
        ui.sidebarCollapsed = !ui.sidebarCollapsed;
        renderNav();
        return;
      }



      if (action === "close-modal") {
        closeModal();
        return;
      }

      if (action === "open-homework-modal") {
        openModal("homework", { homeworkId: button.dataset.homeworkId || "" });
        return;
      }

      if (action === "open-exam-modal") {
        openModal("exam", { examId: button.dataset.examId || "" });
        return;
      }

      if (action === "open-lesson-modal") {
        openModal("lesson", {
          lessonId: button.dataset.lessonId || "",
          preset: {
            weekday: button.dataset.weekday,
            startTime: button.dataset.startTime,
            endTime: button.dataset.endTime
          }
        });
        return;
      }

      if (action === "open-subject-manager") {
        openModal("subjects", { subjectId: button.dataset.subjectId || "" });
        return;
      }

      if (action === "toggle-homework-expand") {
        const id = button.dataset.homeworkId;
        ui.expandedHomework.has(id) ? ui.expandedHomework.delete(id) : ui.expandedHomework.add(id);
        renderApp();
        return;
      }

      if (action === "toggle-homework-status-button") {
        toggleHomeworkStatus(button.dataset.homeworkId);
        return;
      }

      if (action === "set-homework-status-filter") {
        ui.homeworkFilterStatus = button.dataset.status || "alle";
        renderApp();
        return;
      }

      if (action === "set-homework-subject-filter") {
        ui.homeworkFilterSubject = button.dataset.subjectId || "all";
        renderApp();
        return;
      }

      if (action === "toggle-exam-expand") {
        const id = button.dataset.examId;
        ui.expandedExams.has(id) ? ui.expandedExams.delete(id) : ui.expandedExams.add(id);
        renderApp();
        return;
      }

      if (action === "complete-homework") {
        toggleHomeworkStatus(button.dataset.homeworkId, true);
        return;
      }

      if (action === "delete-homework") {
        const item = state.homework.find((entry) => entry.id === button.dataset.homeworkId);
        if (item) {
          openModal("confirm-delete", {
            title: "Hausaufgabe löschen?",
            text: `Soll die Aufgabe "${item.title}" unwiderruflich gelöscht werden?`,
            confirmAction: "confirm-delete-homework",
            payloadId: item.id
          });
        }
        return;
      }

      if (action === "confirm-delete-homework") {
        deleteHomework(button.dataset.targetId);
        closeModal();
        return;
      }

      if (action === "delete-exam") {
        const item = state.exams.find((entry) => entry.id === button.dataset.examId);
        if (item) {
          openModal("confirm-delete", {
            title: "Prüfung löschen?",
            text: `Soll die Prüfung "${item.title}" unwiderruflich gelöscht werden?`,
            confirmAction: "confirm-delete-exam",
            payloadId: item.id
          });
        }
        return;
      }

      if (action === "confirm-delete-exam") {
        deleteExam(button.dataset.targetId);
        closeModal();
        return;
      }

      if (action === "delete-lesson") {
        openModal("confirm-delete", {
          title: "Lektion löschen?",
          text: "Soll dieser Eintrag aus dem Stundenplan entfernt werden?",
          confirmAction: "confirm-delete-lesson",
          payloadId: button.dataset.lessonId
        });
        return;
      }

      if (action === "confirm-delete-lesson") {
        deleteLesson(button.dataset.targetId);
        closeModal();
        return;
      }

      if (action === "delete-subject") {
        const item = state.subjects.find((entry) => entry.id === button.dataset.subjectId);
        if (item) {
          openModal("confirm-delete", {
            title: "Fach löschen?",
            text: `Soll das Fach "${item.name}" gelöscht werden?`,
            confirmAction: "confirm-delete-subject",
            payloadId: item.id
          });
        }
        return;
      }

      if (action === "confirm-delete-subject") {
        deleteSubject(button.dataset.targetId);
        closeModal();
        return;
      }

      if (action === "delete-checklist-item") {
        const exam = state.exams.find((entry) => entry.id === button.dataset.examId);
        if (!exam) {
          return;
        }
        exam.learningChecklist = exam.learningChecklist.filter((entry) => entry.id !== button.dataset.checkId);
        saveState();
        renderApp();
        return;
      }

      if (action === "set-calendar-view") {
        ui.calendarView = button.dataset.view;
        if (ui.calendarView === "day") {
          ui.calendarDate = ui.selectedDay ? parseISODate(ui.selectedDay) : startOfDay(new Date());
        }
        renderApp();
        return;
      }

      if (action === "shift-calendar") {
        shiftCalendar(button.dataset.direction);
        return;
      }

      if (action === "go-calendar-today") {
        ui.calendarDate = startOfDay(new Date());
        if (ui.calendarView !== "day") {
          ui.selectedDay = null;
        }
        renderApp();
        return;
      }

      if (action === "select-calendar-day") {
        ui.selectedDay = button.dataset.date;
        ui.calendarDate = parseISODate(button.dataset.date);
        renderApp();
        return;
      }

      if (action === "close-calendar-panel") {
        ui.selectedDay = null;
        renderApp();
        return;
      }

      if (action === "open-reset-modal") {
        openModal("reset");
        return;
      }

      if (action === "add-break-quick") {
        // Pause-Buttons: read the startTime from the quick-lesson form and advance it by breakMin
        const breakMin = parseInt(button.dataset.break || "5", 10);
        const form = button.closest('form[data-form="lesson-quick"]');
        if (form) {
          const startInput = form.querySelector('input[name="startTime"]');
          if (startInput && startInput.value) {
            const [sh, sm] = startInput.value.split(":").map(Number);
            const totalMin = sh * 60 + sm + breakMin;
            const newTime = `${String(Math.floor(totalMin / 60)).padStart(2, "0")}:${String(totalMin % 60).padStart(2, "0")}`;
            startInput.value = newTime;
            showToast(`Startzeit um ${breakMin} Min. Pause verschoben → ${newTime}`);
          } else {
            showToast(`${breakMin} Min. Pause: Bitte zuerst eine Startzeit eingeben`);
          }
        }
        return;
      }

      if (action === "confirm-reset") {
        state = {
          subjects: [],
          homework: [],
          exams: [],
          timetable: [],
          drafts: {},
          settings: { ...state.settings }
        };
        ui.expandedHomework.clear();
        ui.expandedExams.clear();
        ui.selectedDay = null;
        saveState({ message: "Alle Daten wurden gelöscht" });
        closeModal();
        renderApp();
      }
    }

    document.addEventListener("click", (event) => {
      const navTarget = event.target.closest("[data-section]");
      if (navTarget) {
        setSection(navTarget.dataset.section);
        return;
      }

      const actionTarget = event.target.closest("[data-action]");
      if (actionTarget) {
        handleAction(actionTarget);
      }
    });

    document.addEventListener("submit", (event) => {
      const form = event.target;
      event.preventDefault();
      if (form.matches('[data-form="auth-signup"]')) {
        registerWithEmail(form);
      } else if (form.matches('[data-form="auth-signin"]')) {
        signInWithEmail(form);
      } else if (form.matches('[data-form="homework"]')) {
        saveHomeworkFromForm(form);
      } else if (form.matches('[data-form="exam"]')) {
        saveExamFromForm(form);
      } else if (form.matches('[data-form="lesson"]')) {
        saveLessonFromForm(form);
      } else if (form.matches('[data-form="subject"]')) {
        saveSubjectFromForm(form);
      } else if (form.matches('[data-form="lesson-quick"]')) {
        // Quick lesson add from subject modal
        const subjectId = form.dataset.subjectId;
        const data = Object.fromEntries(new FormData(form).entries());
        const subject = getSubject(subjectId);
        if (!subjectId || !subject) return;
        const startTime = data.startTime || "08:00";
        // Calculate endTime: startTime + 45 minutes
        const [sh, sm] = startTime.split(":").map(Number);
        const totalEnd = sh * 60 + sm + 45;
        const endTime = `${String(Math.floor(totalEnd / 60)).padStart(2, "0")}:${String(totalEnd % 60).padStart(2, "0")}`;
        const candidate = {
          id: "",
          weekday: data.weekday,
          fachId: subjectId,
          startTime,
          endTime,
          room: (data.room || "").trim() || subject.room || ""
        };
        if (hasLessonOverlap(candidate)) {
          showToast("Zeitblock überschneidet sich bereits");
          return;
        }
        state.timetable.push({ ...candidate, id: generateId("lesson") });
        ui.subjectLessonDrafts[subjectId] = {
          weekday: data.weekday || "Mo",
          startTime: endTime,
          room: (data.room || "").trim()
        };
        saveState();
        openModal("subjects", { subjectId });
        renderApp();
      } else if (form.matches('[data-form="checklist-item"]')) {
        const exam = state.exams.find((entry) => entry.id === form.dataset.examId);
        if (!exam) {
          return;
        }
        const text = new FormData(form).get("checkText").trim();
        if (!text) {
          return;
        }
        exam.learningChecklist.push({ id: generateId("check"), text, done: false });
        saveState();
        renderApp();
      }
    });

    document.addEventListener("change", (event) => {
      const target = event.target;

      if (target.matches("[data-admin-approval]")) {
        (async () => {
          if (!appStatus.isAdmin) {
            target.checked = !target.checked;
            return;
          }

          const uid = target.dataset.adminApproval;
          const approved = target.checked;
          target.disabled = true;

          try {
            const token = await getFreshIdToken();
            const response = await fetch("/api/admin/approve", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`
              },
              body: JSON.stringify({ uid, approved })
            });

            if (!response.ok) {
              throw new Error("API-Fehler");
            }

            showToast(approved ? "Benutzer genehmigt" : "Genehmigung entfernt");
            await refreshAdminAccess();
            if (ui.adminSelectedUid === uid) {
              await loadAdminUserDetail(uid);
            } else {
              renderApp();
            }
          } catch (error) {
            console.error(error);
            target.checked = !approved;
            target.disabled = false;
            showToast("Aktualisierung fehlgeschlagen");
          }
        })();
        return;
      }

      if (target.matches("[data-homework-status]")) {
        toggleHomeworkStatus(target.dataset.homeworkStatus, target.checked);
        return;
      }

      if (target.matches("[data-exam-check]")) {
        const [examId, checkId] = target.dataset.examCheck.split("::");
        const exam = state.exams.find((entry) => entry.id === examId);
        const checklistItem = exam?.learningChecklist.find((entry) => entry.id === checkId);
        if (!checklistItem) {
          return;
        }
        checklistItem.done = target.checked;
        saveState();
        renderApp();
        return;
      }

      if (target.matches("[data-filter='homework-subject']")) {
        ui.homeworkFilterSubject = target.value;
        renderApp();
        return;
      }

      if (target.matches("[data-filter='homework-status']")) {
        ui.homeworkFilterStatus = target.value;
        renderApp();
        return;
      }

      if (target.matches("[data-setting-toggle='erinnerungen']")) {
        state.settings.erinnerungen = target.checked;
        saveState();
      }

      const draftForm = target.closest("[data-draft-form]");
      if (draftForm) {
        updateDraftFromForm(draftForm);
      }
    });

    document.addEventListener("input", (event) => {
      const target = event.target;

      if (target.matches("[data-note-type='homework']")) {
        const item = state.homework.find((entry) => entry.id === target.dataset.itemId);
        if (!item) {
          return;
        }
        item.note = target.value;
        saveState();
        return;
      }

      if (target.matches("[data-note-type='exam']")) {
        const exam = state.exams.find((entry) => entry.id === target.dataset.itemId);
        if (!exam) {
          return;
        }
        exam.note = target.value;
        saveState();
        return;
      }

      if (target.matches("[data-setting='name']")) {
        state.settings.name = target.value;
        saveState();
        return;
      }

      if (target.matches("[data-setting='klasse']")) {
        state.settings.klasse = target.value;
        saveState();
      }

      const draftForm = target.closest("[data-draft-form]");
      if (draftForm) {
        updateDraftFromForm(draftForm);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && ui.modal) {
        closeModal();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && appStatus.saveTimer) {
        window.clearTimeout(appStatus.saveTimer);
        appStatus.saveTimer = null;
        pushStateToCloud(state);
      }
    });

    if (DEMO_REQUESTED) {
      startDemo();
    } else {
      renderApp();
    }
    startAuthentication();
  </script>
</body>
</html>
