<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stop &amp; Learn</title>
  <link rel="icon" type="image/png" href="./logo-stop-learn-square.png">
  <link rel="apple-touch-icon" href="./logo-stop-learn-square.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #151219;
      --bg-elevated: rgba(20, 20, 36, 0.86);
      --surface: rgba(23, 23, 42, 0.65);
      --surface-strong: rgba(26, 26, 46, 0.8);
      --surface-soft: rgba(255, 255, 255, 0.04);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e7e0e9;
      --muted: #a6accd;
      --accent: #7c5cbf;
      --accent-soft: rgba(124, 92, 191, 0.18);
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
      --yellow: #facc15;
      --blue: #38bdf8;
      --shadow: 0 24px 60px rgba(2, 6, 23, 0.38);
      --radius: 18px;
      --radius-sm: 12px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --sidebar-width: 272px;
      --sidebar-collapsed-width: 96px;
      --bottom-nav-height: 88px;
      --hour-height: 74px;
      --max-width: 1520px;
      --page-padding: 18px;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      font-size: 1.25em;
    }

    :root {
      --bg: #f2f3fb;
      --bg-elevated: rgba(255, 255, 255, 0.92);
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --surface-soft: rgba(124, 92, 191, 0.08);
      --line: rgba(15, 23, 42, 0.08);
      --text: #171827;
      --muted: #5f6783;
      --accent: #7456c9;
      --accent-soft: rgba(116, 86, 201, 0.12);
      --shadow: 0 20px 48px rgba(71, 85, 105, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Outfit", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124, 92, 191, 0.28), transparent 26%),
        radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.12), transparent 28%),
        linear-gradient(160deg, rgba(255, 255, 255, 0.02), transparent 36%),
        var(--bg);
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 420px;
      height: 420px;
      border-radius: 999px;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
    }

    body::before {
      top: -120px;
      right: -140px;
      background: rgba(124, 92, 191, 0.18);
    }

    body::after {
      bottom: -180px;
      left: -120px;
      background: rgba(56, 189, 248, 0.12);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
      transition: transform var(--transition), background var(--transition), color var(--transition), border-color var(--transition), box-shadow var(--transition), opacity var(--transition);
    }

    button:active {
      transform: scale(0.98);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    .sidebar {
      display: none;
      position: sticky;
      top: 0;
      align-self: flex-start;
      height: 100vh;
      width: var(--sidebar-width);
      padding: 24px 18px;
      background: rgba(11, 12, 24, 0.82);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--line);
      transition: width var(--transition), padding var(--transition), background var(--transition);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar::-webkit-scrollbar-track {
      background: transparent;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
    }

    html[data-theme="light"] .sidebar::-webkit-scrollbar-thumb {
      background: rgba(15, 23, 42, 0.12);
    }

    /* Light-mode: heller Sidebar-Stil passend zum restlichen Design */
    html[data-theme="light"] .sidebar {
      background: rgba(255, 255, 255, 0.96);
      border-right: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 2px 0 18px rgba(71, 85, 105, 0.08);
    }

    html[data-theme="light"] .sidebar .nav-button {
      color: #5f6783;
    }

    html[data-theme="light"] .sidebar .nav-button:hover {
      background: rgba(116, 86, 201, 0.07);
      color: #171827;
      border-color: rgba(116, 86, 201, 0.16);
    }

    html[data-theme="light"] .sidebar .nav-button.active {
      background: rgba(116, 86, 201, 0.12);
      color: #7456c9;
      border-color: rgba(116, 86, 201, 0.28);
    }

    html[data-theme="light"] .sidebar .brand-title {
      color: #171827;
    }

    html[data-theme="light"] .sidebar .brand-subtitle,
    html[data-theme="light"] .sidebar .eyebrow {
      color: #5f6783;
    }

    html[data-theme="light"] .sidebar .sidebar-footer-copy p {
      color: #5f6783;
    }

    html[data-theme="light"] .sidebar .sidebar-footer-card {
      background: rgba(116, 86, 201, 0.07);
      border-color: rgba(116, 86, 201, 0.14);
    }

    html[data-theme="light"] .sidebar .ghost-button {
      color: #5f6783;
      border-color: rgba(15, 23, 42, 0.1);
      background: rgba(15, 23, 42, 0.03);
    }

    html[data-theme="light"] .sidebar .ghost-button:hover {
      background: rgba(116, 86, 201, 0.08);
      border-color: rgba(116, 86, 201, 0.2);
      color: #7456c9;
    }

    html[data-theme="light"] .sidebar .icon-button {
      color: #5f6783;
      background: rgba(15, 23, 42, 0.04);
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
      padding-inline: 12px;
    }

    .sidebar.collapsed .brand-copy,
    .sidebar.collapsed .nav-label,
    .sidebar.collapsed .sidebar-footer-copy {
      opacity: 0;
      width: 0;
      overflow: hidden;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 6px 20px;
    }

    .brand-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      padding: 3px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 36px rgba(56, 189, 248, 0.18);
      flex-shrink: 0;
    }

    .brand-mark img,
    .topbar-brand img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: inherit;
    }

    .brand-copy {
      min-width: 0;
      transition: opacity var(--transition);
    }

    .eyebrow {
      margin: 0 0 4px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand-title,
    .topbar-title {
      margin: 0;
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-subtitle,
    .topbar-subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--surface-soft);
      border: 1px solid transparent;
      flex-shrink: 0;
    }

    .icon-button:hover {
      background: var(--accent-soft);
      border-color: rgba(124, 92, 191, 0.28);
    }

    .nav-stack {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      color: var(--muted);
      border: 1px solid transparent;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    .nav-button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(124, 92, 191, 0.16), transparent 85%);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .nav-button:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border-color: var(--line);
    }

    .nav-button.active {
      background: rgba(124, 92, 191, 0.16);
      color: var(--text);
      border-color: rgba(124, 92, 191, 0.38);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .nav-button.active::before {
      opacity: 1;
    }

    .nav-icon {
      width: 22px;
      flex-shrink: 0;
      text-align: center;
      font-size: 1.02rem;
    }

    .nav-label {
      font-weight: 600;
      white-space: nowrap;
      transition: opacity var(--transition);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 18px 8px 6px;
    }

    .sidebar-footer-card {
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(124, 92, 191, 0.16), rgba(56, 189, 248, 0.1));
      border: 1px solid rgba(124, 92, 191, 0.18);
    }

    .sidebar-footer-copy {
      transition: opacity var(--transition);
    }

    .sidebar-footer-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .main-shell {
      flex: 1;
      min-width: 0;
      width: 100%;
    }

    .main-inner {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      padding: 18px var(--page-padding) calc(var(--bottom-nav-height) + 44px);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 25;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px 0 20px;
      backdrop-filter: blur(12px);
    }

    .topbar-brand {
      width: 64px;
      height: 64px;
      padding: 4px;
      border-radius: 18px;
      flex-shrink: 0;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 36px rgba(56, 189, 248, 0.14);
    }

    .topbar-copy {
      flex: 1;
      min-width: 0;
    }

    .topbar-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Topbar Status-Chips ausgeblendet */
    .topbar-status .soft-chip {
      display: none;
    }

    .view-root {
      display: grid;
      gap: 18px;
    }

    .hero-card,
    .card,
    .modal-card,
    .day-panel,
    .calendar-card {
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .hero-card {
      padding: 22px;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: auto -10% -30% auto;
      width: 220px;
      height: 220px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(124, 92, 191, 0.35), transparent 65%);
      z-index: -1;
    }

    .hero-headline {
      margin: 0;
      font-size: clamp(1.55rem, 3vw, 2.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      max-width: 18ch;
    }

    .hero-description {
      margin: 12px 0 0;
      color: var(--muted);
      max-width: 58ch;
      line-height: 1.6;
    }

    .hero-actions,
    .section-actions,
    .toolbar-group,
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .hero-actions {
      margin-top: 18px;
    }

    .content-grid {
      display: grid;
      gap: 18px;
    }

    .content-grid.two-col {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .content-grid.dashboard-grid {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    .stats-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      margin-top: 18px;
    }

    .stat-card {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .stat-label {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      margin: 10px 0 4px;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .stat-helper {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .card {
      padding: 20px;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .card-title {
      margin: 0;
      font-size: 1.14rem;
      letter-spacing: -0.02em;
    }

    .card-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .soft-chip,
    .status-badge,
    .countdown-chip,
    .subject-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1;
      border: 1px solid transparent;
    }

    .soft-chip {
      background: var(--surface-soft);
      color: var(--text);
      border-color: var(--line);
    }

    .soft-chip strong {
      font-weight: 700;
    }

    .subject-badge {
      background: color-mix(in srgb, var(--badge-color, var(--accent)) 18%, transparent);
      color: var(--text);
      border-color: color-mix(in srgb, var(--badge-color, var(--accent)) 46%, transparent);
    }

    .subject-badge::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--badge-color, var(--accent));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--badge-color, var(--accent)) 18%, transparent);
    }

    .subject-badge.ghost {
      --badge-color: rgba(255, 255, 255, 0.2);
      color: var(--muted);
    }

    .status-badge.open {
      background: rgba(249, 115, 22, 0.16);
      color: #f9b777;
      border-color: rgba(249, 115, 22, 0.32);
    }

    .status-badge.done {
      background: rgba(34, 197, 94, 0.16);
      color: #78e5a0;
      border-color: rgba(34, 197, 94, 0.28);
    }

    .countdown-chip {
      background: rgba(250, 204, 21, 0.14);
      color: #fbe26a;
      border-color: rgba(250, 204, 21, 0.22);
    }

    .countdown-chip.today {
      background: rgba(239, 68, 68, 0.16);
      color: #ff9797;
      border-color: rgba(239, 68, 68, 0.28);
      animation: pulse 1.3s infinite;
    }

    .countdown-chip.overdue {
      background: rgba(239, 68, 68, 0.12);
      color: #ffaaa5;
      border-color: rgba(239, 68, 68, 0.2);
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.25);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
      }
    }

    .list-stack {
      display: grid;
      gap: 14px;
    }

    .mini-list {
      display: grid;
      gap: 10px;
    }

    .mini-item,
    .lesson-inline,
    .day-event,
    .list-item-card {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .mini-item-content,
    .day-event-content {
      flex: 1;
      min-width: 0;
    }

    .mini-item h4,
    .lesson-inline h4,
    .list-summary-title,
    .day-event h4 {
      margin: 0;
      font-size: 1rem;
    }

    .mini-item p,
    .lesson-inline p,
    .day-event p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .lesson-dot {
      width: 16px;
      height: 16px;
      margin-top: 4px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--dot-color, var(--accent));
      box-shadow: 0 0 0 6px color-mix(in srgb, var(--dot-color, var(--accent)) 18%, transparent);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button,
    .ghost-button,
    .danger-button {
      min-height: 44px;
      padding: 0 16px;
      border-radius: 14px;
      font-weight: 600;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: none;
    }

    .button {
      background: linear-gradient(135deg, rgba(124, 92, 191, 0.9), rgba(102, 126, 234, 0.86));
      color: #fff;
      box-shadow: 0 18px 30px rgba(124, 92, 191, 0.26);
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .ghost-button {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--line);
      color: var(--text);
    }

    .ghost-button:hover {
      background: rgba(124, 92, 191, 0.1);
      border-color: rgba(124, 92, 191, 0.26);
    }

    .danger-button {
      background: rgba(239, 68, 68, 0.12);
      color: #ffa6a6;
      border-color: rgba(239, 68, 68, 0.24);
    }

    .empty-state {
      padding: 32px 20px;
      text-align: center;
      border-radius: 18px;
      border: 1px dashed rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.02);
    }

    .empty-state .empty-icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 12px;
    }

    .empty-state h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .empty-state p {
      margin: 10px auto 0;
      max-width: 36ch;
      line-height: 1.55;
      color: var(--muted);
    }

    .section-toolbar {
      display: grid;
      gap: 14px;
    }

    .filter-bar {
      align-items: center;
    }

    .field,
    .toggle-card {
      display: grid;
      gap: 8px;
    }

    .field label,
    .toggle-copy strong {
      font-weight: 600;
    }

    .field span,
    .field small,
    .toggle-copy p {
      color: var(--muted);
      line-height: 1.5;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"],
    textarea,
    select {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
    }

    html[data-theme="light"] input[type="text"],
    html[data-theme="light"] input[type="date"],
    html[data-theme="light"] input[type="time"],
    html[data-theme="light"] textarea,
    html[data-theme="light"] select {
      background: rgba(15, 23, 42, 0.03);
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="time"]:focus,
    textarea:focus,
    select:focus {
      border-color: rgba(124, 92, 191, 0.44);
      box-shadow: 0 0 0 4px rgba(124, 92, 191, 0.12);
    }

    textarea {
      min-height: 116px;
      resize: vertical;
    }

    input[type="color"] {
      width: 100%;
      min-height: 48px;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    .form-grid.two {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    .list-card {
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      overflow: hidden;
    }

    .list-card.expanded {
      border-color: rgba(124, 92, 191, 0.28);
      box-shadow: 0 22px 40px rgba(15, 23, 42, 0.18);
    }

    .list-card-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 16px;
    }

    .item-summary {
      width: 100%;
      text-align: left;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    .list-summary-head,
    .list-summary-meta,
    .inline-actions,
    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .list-summary-meta {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .list-body {
      padding: 0 16px 16px;
      display: grid;
      gap: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.02);
    }

    .list-body > :first-child {
      padding-top: 14px;
    }

    .meta-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .meta-card {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .meta-card strong {
      display: block;
      margin-bottom: 6px;
    }

    .muted-text {
      color: var(--muted);
      line-height: 1.6;
    }

    .inline-note textarea {
      min-height: 102px;
    }

    .toggle-box,
    .task-check,
    .checklist-item input,
    .switch input {
      accent-color: var(--accent);
    }

    .checklist {
      display: grid;
      gap: 10px;
    }

    .checklist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .checklist-item.done span {
      color: var(--muted);
      text-decoration: line-through;
    }

    .checklist-item span {
      flex: 1;
      min-width: 0;
    }

    .tiny-button {
      min-width: 34px;
      min-height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .tiny-button:hover {
      color: var(--text);
      border-color: rgba(124, 92, 191, 0.24);
      background: rgba(124, 92, 191, 0.1);
    }

    .tiny-button.danger {
      color: #ffa6a6;
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.18);
    }

    .tiny-button.danger:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.24);
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(6, minmax(70px, 1fr));
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      background: rgba(11, 12, 24, 0.88);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--line);
      overflow-x: auto;
    }

    html[data-theme="light"] .bottom-nav {
      background: rgba(255, 255, 255, 0.9);
    }

    .bottom-nav .nav-button {
      min-width: 72px;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
      padding: 10px 8px;
      border-radius: 18px;
      text-align: center;
      font-size: 0.8rem;
    }

    .bottom-nav .nav-label {
      font-size: 0.76rem;
      line-height: 1.2;
      white-space: normal;
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: end center;
      padding: 20px;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(8, 10, 18, 0.66);
      backdrop-filter: blur(12px);
    }

    .modal-card {
      position: relative;
      width: min(100%, 760px);
      max-height: min(88vh, 860px);
      overflow: auto;
      padding: 22px;
      animation: modalSlide 0.22s ease;
    }

    .modal-card.wide {
      width: min(100%, 980px);
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .modal-header p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .subject-manager {
      display: grid;
      gap: 18px;
    }

    .subject-list {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .subject-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.03);
    }

    .subject-row-main {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      min-width: 0;
    }

    .subject-swatch {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      flex-shrink: 0;
      margin-top: 4px;
      background: var(--swatch-color, var(--accent));
      box-shadow: 0 0 0 7px color-mix(in srgb, var(--swatch-color, var(--accent)) 18%, transparent);
    }

    .subject-row h4 {
      margin: 0;
      font-size: 1rem;
    }

    .subject-row p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .subject-row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .subject-preview-list {
      display: grid;
      gap: 12px;
    }

    .subject-preview-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .subject-preview-main {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .toggle-grid {
      display: grid;
      gap: 14px;
    }

    .toggle-card {
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    .toggle-copy p {
      margin: 6px 0 0;
    }

    .switch {
      position: relative;
      width: 58px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .switch span {
      display: block;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      background: #fff;
      transform: translateX(0);
      transition: transform var(--transition), background var(--transition);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.18);
    }

    .switch input:checked + span {
      transform: translateX(24px);
      background: #f5f3ff;
    }

    .switch:has(input:checked) {
      background: rgba(124, 92, 191, 0.6);
      border-color: rgba(124, 92, 191, 0.24);
    }

    .danger-zone {
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(239, 68, 68, 0.18);
      background: rgba(239, 68, 68, 0.08);
    }

    .danger-zone p {
      margin: 10px 0 0;
      color: #ffb4b4;
      line-height: 1.6;
    }

    .schedule-wrapper {
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .schedule-board {
      min-width: 980px;
      display: grid;
      grid-template-columns: 72px repeat(5, minmax(160px, 1fr));
      gap: 0;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }

    .schedule-head-cell,
    .time-column,
    .day-column,
    .schedule-corner {
      position: relative;
    }

    .schedule-corner,
    .schedule-head-cell {
      min-height: 66px;
      padding: 16px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
    }

    .schedule-head-cell {
      border-left: 1px solid rgba(255, 255, 255, 0.04);
    }

    .schedule-head-cell.today {
      background: rgba(124, 92, 191, 0.16);
    }

    .schedule-head-cell strong {
      display: block;
      font-size: 1rem;
    }

    .schedule-head-cell span {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .time-column,
    .day-column {
      height: calc(var(--hour-height) * 11);
    }

    .time-column {
      background: rgba(255, 255, 255, 0.02);
      border-right: 1px solid var(--line);
    }

    .time-marker {
      position: absolute;
      left: 0;
      right: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .day-column {
      border-left: 1px solid rgba(255, 255, 255, 0.04);
      background-image: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.05) 0,
        rgba(255, 255, 255, 0.05) 1px,
        transparent 1px,
        transparent var(--hour-height)
      );
    }

    .slot-button {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--hour-height);
      background: transparent;
      border-radius: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      color: var(--accent);
      opacity: 0;
      transition: opacity var(--transition), background var(--transition);
    }

    .slot-button::after {
      content: "add";
      font-family: "Material Symbols Outlined";
      font-size: 1.5rem;
    }

    .slot-button:hover {
      background: rgba(124, 92, 191, 0.08);
      opacity: 1;
    }

    .lesson-block {
      position: absolute;
      left: 10px;
      right: 10px;
      padding: 12px;
      border-radius: 16px;
      text-align: left;
      color: #fff;
      background: linear-gradient(
        160deg,
        color-mix(in srgb, var(--lesson-color, var(--accent)) 88%, white 12%),
        color-mix(in srgb, var(--lesson-color, var(--accent)) 68%, black 20%)
      );
      box-shadow: 0 18px 30px color-mix(in srgb, var(--lesson-color, var(--accent)) 28%, transparent);
      z-index: 2;
      overflow: hidden;
    }

    .lesson-block small {
      display: block;
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.82);
      line-height: 1.35;
    }

    .calendar-shell {
      display: grid;
      gap: 18px;
    }

    .calendar-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .calendar-toggle {
      display: inline-flex;
      padding: 4px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line);
    }

    .calendar-toggle button {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .calendar-toggle button.active {
      background: rgba(124, 92, 191, 0.18);
      color: var(--text);
    }

    .calendar-main {
      display: grid;
      gap: 16px;
    }

    .calendar-grid {
      display: grid;
      gap: 10px;
    }

    .calendar-grid.month {
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .calendar-grid.week {
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .calendar-weekday {
      padding: 12px 10px;
      text-align: center;
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
    }

    .calendar-day {
      min-height: 118px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      text-align: left;
      display: grid;
      gap: 10px;
      align-content: flex-start;
    }

    .calendar-day:hover {
      border-color: rgba(124, 92, 191, 0.28);
      background: rgba(124, 92, 191, 0.08);
    }

    .calendar-day.muted {
      opacity: 0.52;
    }

    .calendar-day.today {
      box-shadow: inset 0 0 0 1px rgba(124, 92, 191, 0.48);
      background: rgba(124, 92, 191, 0.12);
    }

    .calendar-day.selected {
      border-color: rgba(124, 92, 191, 0.44);
      background: rgba(124, 92, 191, 0.18);
    }

    .calendar-day strong {
      font-size: 1rem;
    }

    .calendar-day span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .dot-row,
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .event-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--dot-color, var(--accent));
    }

    .day-compact-events {
      display: grid;
      gap: 8px;
    }

    .day-compact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .day-panel {
      position: fixed;
      inset: auto 14px calc(var(--bottom-nav-height) + 14px) 14px;
      z-index: 45;
      padding: 20px;
      transform: translateY(calc(100% + 26px));
      transition: transform var(--transition);
      overflow: auto;
      max-height: min(70vh, 640px);
    }

    .day-panel.open {
      transform: translateY(0);
    }

    .day-panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .day-panel-header p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .settings-grid {
      display: grid;
      gap: 18px;
    }

    .calendar-day-view {
      display: grid;
      gap: 12px;
    }

    .calendar-day-view .calendar-card {
      padding: 18px;
    }

    .calendar-card {
      padding: 16px;
    }

    .calendar-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .calendar-title-row strong {
      font-size: 1rem;
    }

    .calendar-title-row span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.88rem;
      color: var(--text);
    }

    .toast-stack {
      position: fixed;
      top: 16px;
      right: 16px;
      display: grid;
      gap: 10px;
      z-index: 80;
      pointer-events: none;
    }

    .toast {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: var(--shadow);
      animation: toastIn 0.22s ease;
    }

    html[data-theme="light"] .toast {
      background: rgba(15, 23, 42, 0.92);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .desktop-only {
      display: none;
    }

    .mobile-hidden {
      display: none;
    }

    @media (min-width: 900px) {
      :root {
        --page-padding: 26px;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
      }

      .main-inner {
        padding: 24px var(--page-padding) 46px;
      }

      .bottom-nav {
        display: none;
      }

      .desktop-only,
      .mobile-hidden {
        display: inline-flex;
      }



      .modal-layer {
        place-items: center;
      }

      .subject-manager {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }

      .calendar-shell {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }

      .calendar-shell.with-panel {
        grid-template-columns: minmax(0, 1fr) 360px;
      }

      .day-panel {
        position: sticky;
        top: 94px;
        inset: auto;
        transform: translateX(20px);
        opacity: 0;
        pointer-events: none;
      }

      .day-panel.open {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
      }

      .settings-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: center;
      }

      .topbar-status {
        display: none;
      }

      .hero-card,
      .card,
      .modal-card,
      .calendar-card,
      .day-panel {
        border-radius: 20px;
      }

      .list-card-top {
        grid-template-columns: 1fr;
      }

      .inline-actions {
        justify-content: space-between;
      }




    }

    /* 2026 visual redesign based on mobile template screens */
    html[data-theme="light"] {
      --bg: #edf3ff;
      --bg-elevated: rgba(255, 255, 255, 0.82);
      --surface: rgba(255, 255, 255, 0.92);
      --surface-strong: rgba(255, 255, 255, 0.98);
      --surface-soft: rgba(125, 102, 232, 0.08);
      --line: rgba(112, 119, 146, 0.15);
      --text: #17182e;
      --muted: #6f7794;
      --accent: #7865df;
      --accent-soft: rgba(120, 101, 223, 0.16);
      --shadow: 0 16px 38px rgba(107, 122, 177, 0.18);
      --radius: 28px;
      --radius-sm: 22px;
      --page-padding: 20px;
    }

    html[data-theme="light"] body {
      background:
        radial-gradient(circle at 50% 0%, rgba(170, 135, 255, 0.22), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(100, 210, 255, 0.24), transparent 34%),
        linear-gradient(180deg, #fbfcff 0%, #eef4ff 42%, #d9f1ff 100%);
      color: var(--text);
    }

    html[data-theme="light"] body::before {
      top: -100px;
      right: -80px;
      width: 420px;
      height: 280px;
      background: rgba(160, 138, 255, 0.18);
      filter: blur(88px);
      opacity: 0.75;
    }

    html[data-theme="light"] body::after {
      bottom: -120px;
      left: -60px;
      width: 440px;
      height: 300px;
      background: rgba(93, 203, 255, 0.2);
      filter: blur(92px);
      opacity: 0.8;
    }

    html[data-theme="light"] .hero-card,
    html[data-theme="light"] .card,
    html[data-theme="light"] .modal-card,
    html[data-theme="light"] .day-panel,
    html[data-theme="light"] .calendar-card,
    html[data-theme="light"] .list-card {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(111, 119, 148, 0.14);
      box-shadow: 0 14px 36px rgba(111, 119, 148, 0.14);
      backdrop-filter: blur(20px);
    }

    html[data-theme="light"] .main-inner {
      padding-top: 14px;
      padding-bottom: calc(var(--bottom-nav-height) + 34px);
    }

    html[data-theme="light"] .sidebar {
      background: rgba(255, 255, 255, 0.75);
      box-shadow: 0 0 0 1px rgba(111, 119, 148, 0.08), 18px 0 36px rgba(111, 119, 148, 0.08);
    }

    html[data-theme="light"] .topbar {
      padding: 8px 0 10px;
    }

    html[data-theme="light"] .topbar-brand {
      display: none;
    }

    html[data-theme="light"] .topbar-copy .eyebrow {
      font-size: 0.72rem;
    }

    html[data-theme="light"] .bottom-nav {
      left: 12px;
      right: 12px;
      bottom: 12px;
      grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(111, 119, 148, 0.16);
      box-shadow: 0 18px 32px rgba(111, 119, 148, 0.18);
      backdrop-filter: blur(24px);
      padding: 10px 10px calc(12px + env(safe-area-inset-bottom, 0px));
      gap: 8px;
    }

    html[data-theme="light"] .bottom-nav .nav-button {
      min-width: 0;
      gap: 6px;
      border-radius: 22px;
      color: #717792;
      border: 1px solid transparent;
      padding: 11px 6px;
      font-size: 0.8rem;
    }

    html[data-theme="light"] .bottom-nav .nav-button.active {
      color: #1a1930;
      background: linear-gradient(180deg, rgba(236, 230, 255, 0.96), rgba(217, 230, 255, 0.96));
      border-color: rgba(120, 101, 223, 0.2);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.6), 0 10px 18px rgba(120, 101, 223, 0.14);
    }

    html[data-theme="light"] .bottom-nav .nav-label {
      font-size: 0.72rem;
      line-height: 1.15;
      white-space: normal;
      text-transform: none;
    }

    .page-shell {
      display: grid;
      gap: 20px;
    }

    .page-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .page-title {
      margin: 0;
      font-size: clamp(2.05rem, 9vw, 4rem);
      line-height: 0.95;
      letter-spacing: -0.07em;

    function startOfDay(date) {
      const copy = new Date(date);
      copy.setHours(0, 0, 0, 0);
      return copy;
    }

    function addDays(date, amount) {
      const copy = new Date(date);
      copy.setDate(copy.getDate() + amount);
      return copy;
    }

    function addMonths(date, amount) {
      const copy = new Date(date);
      copy.setMonth(copy.getMonth() + amount);
      return copy;
    }

    function formatISODate(date) {
      const localDate = startOfDay(date);
      const year = localDate.getFullYear();
      const month = String(localDate.getMonth() + 1).padStart(2, "0");
      const day = String(localDate.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseISODate(value) {
      return value ? new Date(value + "T00:00:00") : null;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function generateId(prefix) {
      return `${prefix}-${Math.random().toString(36).slice(2, 9)}-${Date.now().toString(36)}`;
    }

    function formatDate(dateValue, options = {}) {
      const date = typeof dateValue === "string" ? parseISODate(dateValue) : dateValue;
      return new Intl.DateTimeFormat("de-DE", options).format(date);
    }

    function formatDayAndDate(dateValue) {
      return formatDate(dateValue, {
        weekday: "long",
        day: "2-digit",
        month: "long"
      });
    }

    function formatShortDate(dateValue) {
      return formatDate(dateValue, {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatMonthLabel(dateValue) {
      return formatDate(dateValue, {
        month: "long",
        year: "numeric"
      });
    }

    function formatWeekLabel(dateValue) {
      const start = startOfWeek(dateValue);
      const end = addDays(start, 6);
      const startLabel = formatDate(start, { day: "2-digit", month: "short" });
      const endLabel = formatDate(end, { day: "2-digit", month: "short", year: "numeric" });
      return `${startLabel} – ${endLabel}`;
    }

    function formatTimeRange(start, end) {
      return `${start} – ${end}`;
    }

    function weekdayForDate(dateValue) {
      const date = typeof dateValue === "string" ? parseISODate(dateValue) : dateValue;
      return DAY_NAMES[date.getDay()];
    }

    function startOfWeek(dateValue) {
      const date = startOfDay(typeof dateValue === "string" ? parseISODate(dateValue) : dateValue);
      const day = date.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      return addDays(date, diff);
    }

    function isSameDay(dateA, dateB) {
      return formatISODate(dateA) === formatISODate(dateB);
    }

    function todayIso() {
      return formatISODate(new Date());
    }

    function countdownInfo(dateValue) {
      const target = startOfDay(typeof dateValue === "string" ? parseISODate(dateValue) : dateValue);
      const diff = Math.round((target.getTime() - startOfDay(new Date()).getTime()) / 86400000);
      if (diff === 0) {
        return { text: "heute", className: "today" };
      }
      if (diff === 1) {
        return { text: "morgen", className: "" };
      }
      if (diff > 1) {
        return { text: `in ${diff} Tagen`, className: "" };
      }
      if (diff === -1) {
        return { text: "1 Tag überfällig", className: "overdue" };
      }
      return { text: `${Math.abs(diff)} Tage überfällig`, className: "overdue" };
    }

    function renderCountdown(dateValue) {
      const info = countdownInfo(dateValue);
      return `<span class="countdown-chip ${info.className}">${escapeHtml(info.text)}</span>`;
    }

    function normalizeState(candidate) {
      const fallback = createSampleState();
      const normalized = {
        subjects: Array.isArray(candidate?.subjects) ? candidate.subjects : fallback.subjects,
        homework: Array.isArray(candidate?.homework) ? candidate.homework : fallback.homework,
        exams: Array.isArray(candidate?.exams) ? candidate.exams : fallback.exams,
        timetable: Array.isArray(candidate?.timetable) ? candidate.timetable : fallback.timetable,
        drafts: candidate?.drafts && typeof candidate.drafts === "object" ? candidate.drafts : {},
        settings: {
          ...fallback.settings,
          ...(candidate?.settings || {})
        }
      };

      normalized.homework = normalized.homework.map((item) => ({
        ...item,
        status: item.status === "erledigt" ? "erledigt" : "offen",
        note: item.note || ""
      }));

      normalized.exams = normalized.exams.map((item) => ({
        ...item,
        note: item.note || "",
        topics: Array.isArray(item.topics) ? item.topics : [],
        learningChecklist: Array.isArray(item.learningChecklist)
          ? item.learningChecklist.map((entry) => {
              if (typeof entry === "string") {
                return { id: generateId("check"), text: entry, done: false };
              }
              return {
                id: entry.id || generateId("check"),
                text: entry.text || "",
                done: Boolean(entry.done)
              };
            })
          : []
      }));

      return normalized;
    }

        headers: {

        }

        throw new Error("Firebase-Konfiguration konnte nicht geladen werden.");

    function userDocRef(uid) {

    async function getFreshIdToken() {
      if (!appStatus.user) {
        throw new Error("Nicht angemeldet");
      }
      return appStatus.user.getIdToken(true);
    }

    async function fetchAdminJson(path) {
      const token = await getFreshIdToken();
      const response = await fetch(path, {
        headers: {
          Authorization: `Bearer ${token}`,
          Accept: "application/json"
        }
      });

      if (response.status === 403) {
        appStatus.isAdmin = false;
        if (ui.section === "admin") {
          ui.section = "dashboard";
        }
        renderNav();
        renderApp();

      if (!response.ok) {

      }
      return payload;

    function stopRemoteSubscription() {
      if (typeof appStatus.unsubscribeState === "function") {
        appStatus.unsubscribeState();
      }
      appStatus.unsubscribeState = null;
    }

    async function pushStateToCloud(nextState = state) {
      if (!appStatus.db || !appStatus.user) {
        return;
      }

      appStatus.syncState = "saving";
      renderTopbar();

      try {
        await setDoc(
          userDocRef(appStatus.user.uid),
          {
            state: normalizeState(nextState),
            updatedAt: serverTimestamp(),
            email: appStatus.user.email || ""
          },
          { merge: true }
        );
        appStatus.syncState = "ready";
        renderTopbar();
      } catch (error) {
        console.error(error);
        appStatus.syncState = "error";
        renderTopbar();
        showToast("Cloud-Speicherung fehlgeschlagen");
      }
    }

    function scheduleRemoteSave() {
      if (!appStatus.db || !appStatus.user || appStatus.isApplyingRemoteState) {
        return;
      }

      window.clearTimeout(appStatus.saveTimer);
      appStatus.saveTimer = window.setTimeout(() => {
        appStatus.saveTimer = null;
        pushStateToCloud(state);
      }, 700);
    }

    async function hydrateUserState(user) {
      stopRemoteSubscription();
      appStatus.demoMode = false;
      demoStorageActive = false;
      appStatus.user = user;
      appStatus.mode = "syncing";
      appStatus.syncState = "saving";
      renderApp();

      const approvalRef = doc(appStatus.db, "approvals", user.uid);
      const approvalSnapshot = await getDoc(approvalRef);
      if (!approvalSnapshot.exists() || approvalSnapshot.data()?.approved !== true) {
        stopRemoteSubscription();
        appStatus.mode = "pending_approval";
        appStatus.syncState = "ready";
        
        // Listen to approval changes so it updates automatically
        appStatus.unsubscribeState = onSnapshot(approvalRef, (snap) => {
          if (snap.exists() && snap.data()?.approved === true) {
            hydrateUserState(user); // Restart hydration when approved
          }
        });
        renderApp();
        return;
      }

      const ref = userDocRef(user.uid);
      const snapshot = await getDoc(ref);

      if (snapshot.exists() && snapshot.data()?.state) {
        state = normalizeState(snapshot.data().state);
        if (!state.settings.name?.trim()) {
          state.settings.name = user.displayName?.trim() || user.email?.split("@")[0] || "";
        }
        persistLocalCache(state);
      } else {
        state = createFreshUserState(user);
        persistLocalCache(state);
        await pushStateToCloud(state);
      }

      appStatus.unsubscribeState = onSnapshot(ref, (remoteSnapshot) => {
        if (!remoteSnapshot.exists() || !remoteSnapshot.data()?.state) {
          return;
        }

        appStatus.isApplyingRemoteState = true;
        state = normalizeState(remoteSnapshot.data().state);
        persistLocalCache(state);
        const isPendingWrite = remoteSnapshot.metadata.hasPendingWrites;
        appStatus.syncState = isPendingWrite ? "saving" : "ready";
        appStatus.mode = "ready";
        // Don't re-render the whole app while a modal is open (causes flicker/focus loss)
        // or when this is just the echo of our own pending write
        if (!ui.modal && !isPendingWrite) {
          renderApp();
        } else {
          renderTopbar();
        }
        appStatus.isApplyingRemoteState = false;
      }, (error) => {
        console.error(error);
        appStatus.syncState = "error";
        renderTopbar();
        showToast("Live-Synchronisierung unterbrochen");
      });

      appStatus.mode = "ready";
      appStatus.syncState = "ready";
      await refreshAdminAccess();
      renderApp();
    }

    async function refreshAdminAccess() {
      if (!appStatus.user) {
        appStatus.isAdmin = false;
        appStatus.adminUsers = [];
        appStatus.adminDetail = null;
        ui.selectedAdminUids.clear();
        if (ui.section === "admin") {
          ui.section = "dashboard";
        }
        renderNav();
        return;
      }

      try {
        const payload = await fetchAdminJson("/api/admin/users");
        appStatus.isAdmin = true;
        appStatus.adminUsers = Array.isArray(payload.users) ? payload.users : [];
        ui.selectedAdminUids = new Set(
          [...ui.selectedAdminUids].filter((uid) => appStatus.adminUsers.some((user) => user.uid === uid))
        );
        if (!ui.adminSelectedUid && appStatus.adminUsers[0]?.uid) {
          ui.adminSelectedUid = appStatus.adminUsers[0].uid;
        }
        renderNav();
        if (ui.section === "admin" && ui.adminSelectedUid) {
          await loadAdminUserDetail(ui.adminSelectedUid);
        }
      } catch (error) {
        appStatus.isAdmin = false;
        appStatus.adminUsers = [];
        appStatus.adminDetail = null;
        renderNav();
      }
    }

      }

      appStatus.adminLoading = true;
      renderApp();
      try {
        const payload = await fetchAdminJson(`/api/admin/users?uid=${encodeURIComponent(uid)}`);
        appStatus.adminDetail = payload.user || null;
      } catch (error) {
        console.error(error);

    async function startAuthentication() {
      try {
        const firebaseConfig = await loadFirebaseConfig();
        const firebaseApp = initializeApp(firebaseConfig);
        appStatus.auth = getAuth(firebaseApp);
        appStatus.db = getFirestore(firebaseApp);
        appStatus.provider = new GoogleAuthProvider();

        onAuthStateChanged(appStatus.auth, async (user) => {
          window.clearTimeout(appStatus.saveTimer);
          if (appStatus.demoMode) {
            return;
          }
          if (!user) {
            stopRemoteSubscription();
            appStatus.user = null;
            appStatus.demoMode = false;
            appStatus.isAdmin = false;
            appStatus.adminUsers = [];
            appStatus.adminDetail = null;
            appStatus.mode = "signed_out";
            appStatus.syncState = "offline";
            ui.adminSelectedUid = "";
            if (ui.section === "admin") {
              ui.section = "dashboard";
            }
            state = loadState();
            renderApp();
            return;
          }

          try {
            await hydrateUserState(user);
          } catch (error) {
            console.error(error);
            appStatus.mode = "signed_out";
            appStatus.syncState = "error";
            appStatus.configError = "Die Cloud-Daten konnten nicht geladen werden.";
            renderApp();
          }
        });
      } catch (error) {
        console.error(error);
        appStatus.mode = "config_error";
        appStatus.syncState = "error";

    async function logOut() {
      if (appStatus.demoMode) {
        stopRemoteSubscription();
        appStatus.demoMode = false;
        demoStorageActive = false;
        if (DEMO_REQUESTED) {
          try { history.replaceState(null, "", window.location.pathname); } catch (error) {}
        }
        if (appStatus.auth?.currentUser) {
          appStatus.user = null;
          state = loadState();
          showToast("Demo beendet");
          try {
            await hydrateUserState(appStatus.auth.currentUser);
          } catch (error) {
            console.error(error);
            appStatus.mode = "signed_out";
            renderApp();
          }
          return;
        }
        appStatus.user = null;
        appStatus.isAdmin = false;
        appStatus.adminUsers = [];
        appStatus.adminDetail = null;
        ui.adminSelectedUid = "";
        appStatus.mode = "signed_out";
        appStatus.syncState = "offline";
        state = loadState();
        renderApp();
        return;
      }

      if (!appStatus.auth) {
        return;
      }

      try {
        await signOut(appStatus.auth);
        appStatus.isAdmin = false;
        appStatus.adminUsers = [];
        appStatus.adminDetail = null;

    function getSubject(subjectId) {
      return state.subjects.find((subject) => subject.id === subjectId) || null;
    }

    function draftKey(type, entityId = "new") {
      return `${type}:${entityId || "new"}`;
    }

    function getDraft(type, entityId = "new") {
      return state.drafts?.[draftKey(type, entityId)] || {};
    }

    function clearDraft(type, entityId = "new") {
      if (!state.drafts) {
        state.drafts = {};
      }
      delete state.drafts[draftKey(type, entityId)];
    }

    function updateDraftFromForm(form) {
      const type = form.dataset.draftForm;
      if (!type) {
        return;
      }
      const entityId = form.dataset.draftId || "new";
      const values = {};
      for (const [key, value] of new FormData(form).entries()) {
        values[key] = typeof value === "string" ? value : "";
      }
      if (!state.drafts) {
        state.drafts = {};
      }
      state.drafts[draftKey(type, entityId)] = values;
      saveState({ silent: true });
    }

    function sortByDate(items, key) {
      return [...items].sort((a, b) => {
        const aValue = a[key] || "";
        const bValue = b[key] || "";
        return aValue.localeCompare(bValue);
      });
    }

    function sortLessons(entries) {
      return [...entries].sort((a, b) => a.startTime.localeCompare(b.startTime));
    }

    function getLessonsForWeekday(weekday) {
      return sortLessons(state.timetable.filter((item) => item.weekday === weekday));
    }

    function nextLessonInfo() {
      const todayWeekday = weekdayForDate(new Date());
      const lessons = getLessonsForWeekday(todayWeekday);
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const upcoming = lessons.find((lesson) => timeToMinutes(lesson.endTime) >= currentMinutes);
      if (upcoming) {
        return {
          lesson: upcoming,
          subject: getSubject(upcoming.fachId),
          isLive: currentMinutes >= timeToMinutes(upcoming.startTime)
        };
      }
      return {
        lesson: null,
        subject: null,
        isLive: false
      };
    }

    function homeworkProgress() {
      const total = state.homework.length;
      const done = state.homework.filter((item) => item.status === "erledigt").length;
      const open = total - done;
      return {
        total,
        done,
        open,
        percent: total ? Math.round((done / total) * 100) : 0
      };
    }

    function homeworkDueToday() {
      const today = todayIso();
      return sortByDate(
        state.homework.filter((item) => item.status === "offen" && item.dueDate <= today),
        "dueDate"
      );
    }

    function getDashboardData() {
      const today = todayIso();
      const todayWeekday = weekdayForDate(today);
      const todayLessons = getLessonsForWeekday(todayWeekday);
      const dueHomework = sortByDate(
        state.homework.filter((item) => item.status === "offen" && item.dueDate <= today),
        "dueDate"
      );
      const weekExams = sortByDate(
        state.exams.filter((exam) => {
          const diff = Math.round((parseISODate(exam.date).getTime() - parseISODate(today).getTime()) / 86400000);
          return diff >= 0 && diff <= 7;
        }),
        "date"
      );

      return { today, todayLessons, dueHomework, weekExams };
    }

    function lessonTopFromTime(time) {
      const [hour, minute] = time.split(":").map(Number);
      return ((hour - SCHEDULE_START_HOUR) + minute / 60) * HOUR_HEIGHT;
    }

    function lessonHeight(startTime, endTime) {
      const start = lessonTopFromTime(startTime);
      const end = lessonTopFromTime(endTime);
      return Math.max(end - start - 10, 42);
    }

    function renderScheduleBoard() {
      const today = weekdayForDate(new Date());
      const timeMarkers = Array.from({ length: SCHEDULE_END_HOUR - SCHEDULE_START_HOUR + 1 }, (_, index) => {
        const hour = SCHEDULE_START_HOUR + index;
        return `<div class="time-marker" style="top:${index * HOUR_HEIGHT - 12}px">${String(hour).padStart(2, "0")}:00</div>`;
      }).join("");

      const heads = WEEKDAYS.map((day) => `
        <div class="schedule-head-cell ${today === day ? "today" : ""}">
          <strong>${day}</strong>
          <span>${day === today ? "Heute" : "Unterricht"}</span>
        </div>
      `).join("");

      const columns = WEEKDAYS.map((day) => {
        const lessons = getLessonsForWeekday(day);
        const slots = Array.from({ length: SCHEDULE_END_HOUR - SCHEDULE_START_HOUR }, (_, index) => {
          const startHour = SCHEDULE_START_HOUR + index;
          return `
            <button
              class="slot-button"
              type="button"
              aria-label="Lektion hinzufügen"
              style="top:${index * HOUR_HEIGHT}px"
              data-action="open-lesson-modal"
              data-weekday="${day}"
              data-start-time="${String(startHour).padStart(2, "0")}:00"
              data-end-time="${String(startHour + 1).padStart(2, "0")}:00"
            ></button>
          `;
        }).join("");

        const lessonBlocks = lessons.map((lesson) => {
          const subject = getSubject(lesson.fachId);
          const visual = subjectVisual(lesson.fachId);
          const top = lessonTopFromTime(lesson.startTime) + 5;
          return `
            <button
              class="lesson-block"
              type="button"
              style="top:${top}px;height:${lessonHeight(lesson.startTime, lesson.endTime)}px;--lesson-color:${escapeHtml(subject?.color || "#7c5cbf")}"
              data-action="open-lesson-modal"
              data-lesson-id="${lesson.id}"
            >
              <div class="lesson-block-head">
                <span class="material-symbols-outlined">${visual.icon}</span>
                <strong>${escapeHtml(subject?.name || "Fach fehlt")}</strong>
              </div>
              <small>${escapeHtml(formatTimeRange(lesson.startTime, lesson.endTime))}</small>
              <small>${escapeHtml(subject?.teacher || "Unterricht")}</small>
            </button>
          `;
        }).join("");

        return `<div class="day-column">${slots}${lessonBlocks}</div>`;
      }).join("");

      return `
        <div class="schedule-wrapper">
          <div class="schedule-board">
            <div class="schedule-corner"></div>
            ${heads}
            <div class="time-column">${timeMarkers}</div>
            ${columns}
          </div>
        </div>
      `;
    }

    function upcomingExams() {
      const today = todayIso();
      return sortByDate(state.exams.filter((exam) => exam.date >= today), "date");
    }

            return `
              <article class="exam-template-card ${expanded ? "expanded" : ""}" style="--card-gradient:${escapeHtml(visual.gradient)};--card-glow:${escapeHtml(visual.glow)};--card-tint:${escapeHtml(visual.cardTint)}">

                      <span>${exam.learningChecklist.filter((item) => item.done).length}/${exam.learningChecklist.length} Lernschritte erledigt</span>

                ${expanded ? `

                    <div class="template-detail-card">

                          <div class="checklist-item ${entry.done ? "done" : ""}">

                            <span>${escapeHtml(entry.text)}</span>
                            <button class="tiny-button danger" type="button" data-action="delete-checklist-item" data-exam-id="${exam.id}" data-check-id="${entry.id}" aria-label="Lernschritt löschen">×</button>

                          <p class="muted-text">Noch keine Lernschritte hinterlegt.</p>

    function getEventsForDate(dateValue) {
      const iso = typeof dateValue === "string" ? dateValue : formatISODate(dateValue);
      const weekday = weekdayForDate(iso);
      const lessons = WEEKDAYS.includes(weekday)
        ? getLessonsForWeekday(weekday).map((lesson) => ({
            type: "lesson",
            label: "Stundenplan",
            start: lesson.startTime,
            title: getSubject(lesson.fachId)?.name || "Fach fehlt",
            description: getSubject(lesson.fachId)?.teacher || "Unterricht laut Stundenplan",
            color: getSubject(lesson.fachId)?.color || "#7c5cbf"
          }))
        : [];

      const homework = state.homework
        .filter((item) => item.dueDate === iso)
        .map((item) => ({
          type: "homework",
          label: "Hausaufgabe",
          start: "08:00",
          title: item.title,
          description: item.status === "erledigt" ? "Bereits erledigt" : "Heute fällig",
          color: "#38bdf8"
        }));

      const exams = state.exams
        .filter((exam) => exam.date === iso)
        .map((exam) => ({
          type: "exam",
          label: "Prüfung",
          start: "09:00",
          title: exam.title,
          description: countdownInfo(exam.date).text,
          color: "#ef4444"
        }));

      return [...lessons, ...homework, ...exams].sort((a, b) => a.start.localeCompare(b.start));
    }

    function renderEventDots(dateValue) {
      const events = getEventsForDate(dateValue).slice(0, 6);
      if (!events.length) {
        return `<span class="muted-text">Kein Eintrag</span>`;
      }
      return events.map((event) => `<span class="event-dot" style="--dot-color:${escapeHtml(event.color)}"></span>`).join("");
    }

    function renderCalendarMonth() {
      const focus = ui.calendarDate;
      const monthStart = new Date(focus.getFullYear(), focus.getMonth(), 1);
      const gridStart = startOfWeek(monthStart);
      const days = Array.from({ length: 42 }, (_, index) => addDays(gridStart, index));
      const selectedIso = ui.selectedDay;
      const today = todayIso();

      return `
        <div class="calendar-grid month">
          ${CALENDAR_WEEKDAYS.map((day) => `<div class="calendar-weekday">${day}</div>`).join("")}
          ${days.map((day) => {
            const iso = formatISODate(day);
            const isMuted = day.getMonth() !== focus.getMonth();
            const compactEvents = getEventsForDate(iso).slice(0, 2);
            return `
              <button class="calendar-day ${isMuted ? "muted" : ""} ${iso === today ? "today" : ""} ${selectedIso === iso ? "selected" : ""}" type="button" data-action="select-calendar-day" data-date="${iso}">
                <strong>${day.getDate()}</strong>
                <div class="dot-row">${renderEventDots(iso)}</div>
                <div class="day-compact-events">
                  ${compactEvents.map((event) => `
                    <div class="day-compact-item">
                      <span class="event-dot" style="--dot-color:${escapeHtml(event.color)}"></span>
                      <span>${escapeHtml(event.title)}</span>
                    </div>
                  `).join("")}
                </div>
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderCalendarWeek() {
      const weekStart = startOfWeek(ui.calendarDate);
      const days = Array.from({ length: 7 }, (_, index) => addDays(weekStart, index));
      const today = todayIso();

      return `
        <div class="calendar-grid week">
          ${days.map((day) => {
            const iso = formatISODate(day);
            const events = getEventsForDate(iso);
            return `
              <button class="calendar-day ${iso === today ? "today" : ""} ${ui.selectedDay === iso ? "selected" : ""}" type="button" data-action="select-calendar-day" data-date="${iso}">
                <strong>${escapeHtml(formatDate(day, { weekday: "short", day: "2-digit", month: "2-digit" }))}</strong>
                <span>${events.length ? `${events.length} Einträge` : "Keine Termine"}</span>
                <div class="dot-row">${renderEventDots(iso)}</div>
                <div class="day-compact-events">
                  ${events.slice(0, 4).map((event) => `
                    <div class="day-compact-item">
                      <span class="event-dot" style="--dot-color:${escapeHtml(event.color)}"></span>
                      <span>${escapeHtml(event.start)} · ${escapeHtml(event.title)}</span>
                    </div>
                  `).join("")}
                </div>
              </button>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderCalendarDay() {
      const day = ui.calendarDate;
      const iso = formatISODate(day);
      const events = getEventsForDate(iso);
      return `
        <div class="calendar-day-view">
          <div class="calendar-card">
            <div class="calendar-title-row">
              <strong>${escapeHtml(formatDate(day, { weekday: "long", day: "2-digit", month: "long", year: "numeric" }))}</strong>
              <span>${events.length ? `${events.length} Einträge` : "Freier Tag"}</span>
            </div>
            ${events.length ? `
              <div class="list-stack">
                ${events.map((event) => `
                  <div class="day-event">
                    <span class="lesson-dot" style="--dot-color:${escapeHtml(event.color)}"></span>
                    <div class="day-event-content">
                      <div class="list-summary-head">
                        <strong>${escapeHtml(event.title)}</strong>
                        <span class="soft-chip">${escapeHtml(event.label)}</span>
                      </div>
                      <p>${escapeHtml(event.start)} · ${escapeHtml(event.description)}</p>
                    </div>
                  </div>
                `).join("")}
              </div>
            ` : `
              <div class="empty-state">
                <span class="empty-icon">🌤</span>
                <h3>Heute ist frei</h3>
                <p>Für diesen Tag sind aktuell keine Lektionen, Hausaufgaben oder Prüfungen eingetragen.</p>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function activeCalendarPanelDate() {
      if (ui.calendarView === "day") {
        return formatISODate(ui.calendarDate);
      }
      return ui.selectedDay;
    }

    function renderCalendarPanel() {
      const activeDate = activeCalendarPanelDate();
      if (!activeDate) {
        return `
          <aside class="day-panel">
            <div class="empty-state">
              <span class="empty-icon">📌</span>
              <h3>Tag auswählen</h3>
              <p>Klicke im Kalender auf einen Tag, damit die Detailansicht mit allen Ereignissen hereinschiebt.</p>
            </div>
          </aside>
        `;
      }

      const events = getEventsForDate(activeDate);
      return `
        <aside class="day-panel open">
          <div class="day-panel-header">
            <div>
              <p class="eyebrow">Tagesdetails</p>
              <h3 class="card-title">${escapeHtml(formatDate(activeDate, { weekday: "long", day: "2-digit", month: "long", year: "numeric" }))}</h3>
              <p>${events.length ? `${events.length} Ereignisse an diesem Tag.` : "Für diesen Tag gibt es noch keine Einträge."}</p>

            ${ui.calendarView !== "day" ? `<button class="tiny-button" type="button" data-action="close-calendar-panel" aria-label="Panel schließen"><span class="material-symbols-outlined" style="font-size: 1.1em;">close</span></button>` : ""}
          </div>
          ${events.length ? `
            <div class="list-stack">
              ${events.map((event) => `
                <div class="day-event">
                  <span class="lesson-dot" style="--dot-color:${escapeHtml(event.color)}"></span>
                  <div class="day-event-content">
                    <div class="list-summary-head">
                      <strong>${escapeHtml(event.title)}</strong>
                      <span class="soft-chip">${escapeHtml(event.label)}</span>
                    </div>
                    <p>${escapeHtml(event.start)} · ${escapeHtml(event.description)}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          ` : `
            <div class="empty-state">
              <span class="empty-icon">📭</span>
              <h3>Keine Ereignisse</h3>
              <p>An diesem Tag steht gerade nichts an.</p>
            </div>
          `}
        </aside>
      `;
    }

    function calendarLabel() {
      if (ui.calendarView === "month") {
        return formatMonthLabel(ui.calendarDate);
      }
      if (ui.calendarView === "week") {
        return formatWeekLabel(ui.calendarDate);
      }
      return formatDate(ui.calendarDate, { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
    }

      const todayEvents = getEventsForDate(todayIso()).length;
      const openHomework = state.homework.filter((item) => item.status === "offen").length;

      return `
        <section class="page-shell">
          <div class="page-title-row">

          <section class="week-highlight-grid calendar-highlight-grid">

          <section class="template-panel calendar-toolbar-panel">
            <div class="calendar-toolbar template-toolbar">
              <div>
                <h2>${escapeHtml(calendarLabel())}</h2>
                <p class="page-subtitle">Mit einem Klick auf einen Tag öffnet sich die Detailansicht.</p>
              </div>
              <div class="toolbar-group">
                <div class="calendar-toggle">
                  <button type="button" class="${ui.calendarView === "month" ? "active" : ""}" data-action="set-calendar-view" data-view="month">Monat</button>
                  <button type="button" class="${ui.calendarView === "week" ? "active" : ""}" data-action="set-calendar-view" data-view="week">Woche</button>
                  <button type="button" class="${ui.calendarView === "day" ? "active" : ""}" data-action="set-calendar-view" data-view="day">Tag</button>

                  <button class="template-outline-button schedule-action-button" type="button" data-action="go-calendar-today">Heute</button>
                  <button class="template-outline-button schedule-action-button" type="button" data-action="shift-calendar" data-direction="1">Weiter</button>
                </div>
              </div>

            <div class="legend">
              <span class="soft-chip"><span class="event-dot" style="--dot-color:#38bdf8"></span> Hausaufgabe</span>
              <span class="soft-chip"><span class="event-dot" style="--dot-color:#ef4444"></span> Prüfung</span>
              <span class="soft-chip"><span class="event-dot" style="--dot-color:#7c5cbf"></span> Lektion</span>

      `;

    function renderView() {
      const root = document.getElementById("viewRoot");
      if (appStatus.mode !== "ready") {
        root.innerHTML = renderAuthView();
        return;
      }

      let content = "";
      if (ui.section === "dashboard") {
        content = renderDashboard();
      } else if (ui.section === "stundenplan") {
        content = renderStundenplan();
      } else if (ui.section === "hausaufgaben") {
        content = renderHomework();
      } else if (ui.section === "pruefungen") {
        content = renderExams();
      } else if (ui.section === "kalender") {
        content = renderCalendar();
      } else if (ui.section === "einstellungen") {
        content = renderSettings();
      } else if (ui.section === "admin") {
        content = renderAdmin();
      }

      if (appStatus.demoMode) {
        content = `
          <div class="demo-ribbon" role="note">
            <strong>DEMO</strong>
            <span>Du schaust dir Stop &amp; Learn mit erfundenen Beispieldaten an. Probier alles aus – nichts wird in der Cloud gespeichert.</span>

      root.innerHTML = content;
